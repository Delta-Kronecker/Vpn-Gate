name: debug-sstp-handshake

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
    - name: Install sstp-client
      run: |
        sudo modprobe ppp_generic || true
        sudo modprobe ppp_async || true
        ls -l /dev/ppp || echo 'NO /dev/ppp !!'
        sudo apt-get update
        sudo apt-get install -y sstp-client ppp
        sstpc --version
        ls -l /usr/lib/pppd/*/sstp-pppd-plugin.so

    - name: Full end-to-end SSTP test (dial + tunnel GeoIP probe)
      run: |
        set -x
        sudo sstpc --log-stderr --log-level 2 --tls-ext --cert-warn \
          --user vpn --password vpn public-vpn-90.opengw.net:443 \
          noauth noipdefault nodefaultroute refuse-eap refuse-chap \
          refuse-mschap noccp nobsdcomp nodeflate novj novjccomp \
          > /tmp/sstp.log 2>&1 &
        echo "sstpc launched"
        PPP_OK=0
        for i in $(seq 1 30); do
          if ip -o link | grep -Eo 'ppp[0-9]+'; then PPP_OK=1; echo "PPP interface up after ${i}s"; break; fi
          sleep 1
        done
        if [ "$PPP_OK" = "1" ]; then
          IFACE=$(ip -o link | grep -Eo 'ppp[0-9]+' | head -1)
          echo "Interface: $IFACE"
          ip addr show "$IFACE"
          GEO_IP=$(getent hosts ip-api.com | awk '{print $1; exit}')
          echo "GeoIP host: $GEO_IP"
          sudo ip route replace "$GEO_IP/32" dev "$IFACE"
          curl -s --max-time 10 "http://ip-api.com/json/?fields=status,country,countryCode,query"
          echo
          sudo ip route del "$GEO_IP/32" || true
        else
          echo "PPP interface did NOT come up"
        fi
        sudo pkill -9 sstpc || true
        sudo pkill -9 pppd || true
        echo '=========== /tmp/sstp.log ==========='
        cat /tmp/sstp.log || true
