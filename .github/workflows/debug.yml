name: debug-sstp-handshake

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
    - name: Install sstp-client
      run: |
        sudo modprobe ppp_generic || true
        sudo modprobe ppp_async || true
        ls -l /dev/ppp || echo 'NO /dev/ppp !!'
        sudo apt-get update
        sudo apt-get install -y sstp-client ppp
        sstpc --version

    - name: Two parallel dials with unique ifname + GeoIP check
      run: |
        set -x
        sudo sstpc --log-stderr --log-level 2 --tls-ext --cert-warn \
          --user vpn --password vpn public-vpn-90.opengw.net:443 \
          noauth noipdefault nodefaultroute refuse-eap refuse-chap \
          refuse-mschap noccp nobsdcomp nodeflate novj novjccomp \
          ifname sstpdA > /tmp/sstp-a.log 2>&1 &
        sudo sstpc --log-stderr --log-level 2 --tls-ext --cert-warn \
          --user vpn --password vpn public-vpn-162.opengw.net:443 \
          noauth noipdefault nodefaultroute refuse-eap refuse-chap \
          refuse-mschap noccp nobsdcomp nodeflate novj novjccomp \
          ifname sstpdB > /tmp/sstp-b.log 2>&1 &
        echo "two dials launched"
        for i in $(seq 1 40); do
          A=$(ip -o -4 addr show dev sstpdA 2>/dev/null | grep -c inet)
          B=$(ip -o -4 addr show dev sstpdB 2>/dev/null | grep -c inet)
          echo "try$i  A=$A  B=$B"
          if [ "$A" = "1" ] && [ "$B" = "1" ]; then break; fi
          sleep 1
        done
        set +e
        echo '=== interfaces ==='
        ip -o -4 addr show | grep sstp
        echo '=== GeoIP via sstpdA ==='
        GEO_IP=$(getent hosts ip-api.com | awk '{print $1; exit}')
        sudo ip route replace "$GEO_IP/32" dev sstpdA
        curl -s --max-time 15 "http://ip-api.com/json/?fields=status,country,countryCode,query"
        echo
        sudo ip route replace "$GEO_IP/32" dev sstpdB
        curl -s --max-time 15 "http://ip-api.com/json/?fields=status,country,countryCode,query"
        echo
        sudo ip route del "$GEO_IP/32" || true
        sudo pkill -9 sstpc || true
        sudo pkill -9 pppd || true
        echo '=========== /tmp/sstp-a.log ==========='
        cat /tmp/sstp-a.log || true
        echo '=========== /tmp/sstp-b.log ==========='
        cat /tmp/sstp-b.log || true
